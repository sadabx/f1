name: Release F1 Dash

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build, such as v1.2.0
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, Package & Release Extension
    runs-on: ubuntu-latest

    steps:
      - name: Resolve version
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build extension packages
        run: |
          chmod +x extension/package.sh
          ./extension/package.sh

      - name: Verify Firefox AMO linter
        run: |
          npx -y addons-linter extension/dist/f1_dash.zip

      - name: Build release notes from commits
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          previous_tag="$(git describe --tags --abbrev=0 "${RELEASE_TAG}^" 2>/dev/null || true)"
          if [[ -n "$previous_tag" ]]; then
            range="$previous_tag..$RELEASE_TAG"
          else
            range="$RELEASE_TAG"
          fi

          {
            echo "## What's new"
            echo
            # Only include commits that modified the extension directory and ignore automated scraping commits
            git log "$range" --no-merges --pretty=format:'- %s' -- extension/ \
              | grep -v -i -E "Automated API Update|scrape" || true
            echo
            if [[ -n "$previous_tag" ]]; then
              echo
              echo "**Full Changelog:** [$previous_tag...$RELEASE_TAG]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/$previous_tag...$RELEASE_TAG)"
            fi
          } > release-notes.md

          # Generate AMO metadata JSON so the changelog appears on the Firefox Add-ons store listing
          python3 -c 'import json; notes = open("release-notes.md").read(); json.dump({"version": {"release_notes": {"en-US": notes}}}, open("amo-metadata.json", "w"), indent=2)'

      - name: Create release and upload assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          assets=(extension/dist/f1_dash_chrome.zip extension/dist/f1_dash.xpi extension/dist/f1_dash.zip)

          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            release_flags=(--draft --verify-tag --notes-file release-notes.md)
            if [[ "$VERSION" == *-* ]]; then
              release_flags+=(--prerelease)
            else
              release_flags+=(--latest)
            fi
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "F1 Dash v$VERSION" \
              "${release_flags[@]}"
          fi

          gh release upload "$RELEASE_TAG" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
          gh release edit "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --notes-file release-notes.md \
            --draft=false

      - name: Push to Firefox Add-ons (AMO)
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          if [ -n "$AMO_JWT_ISSUER" ] && [ -n "$AMO_JWT_SECRET" ]; then
            echo "Submitting extension update directly to Mozilla Add-ons (AMO)..."
            npx -y web-ext sign \
              --source-dir extension \
              --api-key="$AMO_JWT_ISSUER" \
              --api-secret="$AMO_JWT_SECRET" \
              --channel=listed \
              --approval-timeout=0 \
              --amo-metadata=amo-metadata.json \
              --ignore-files="package.sh" "package.json" "VERSION" "manifest.chrome.json" "dist/**" "tests/**" "*.zip" "*.xpi"
          else
            echo "Mozilla AMO credentials not found, skipping Firefox Add-ons upload."
          fi

      - name: Push to Microsoft Edge Add-ons
        env:
          EDGE_ADDONS_API_KEY: ${{ secrets.EDGE_ADDONS_API_KEY }}
          EDGE_ADDONS_CLIENT_ID: ${{ secrets.EDGE_ADDONS_CLIENT_ID }}
          EDGE_ADDONS_PRODUCT_ID: ${{ secrets.EDGE_ADDONS_PRODUCT_ID }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${EDGE_ADDONS_API_KEY:-}" || -z "${EDGE_ADDONS_CLIENT_ID:-}" || -z "${EDGE_ADDONS_PRODUCT_ID:-}" ]]; then
            echo "Edge Add-ons credentials are not configured; skipping Edge submission."
            exit 0
          fi

          api="https://api.addons.microsoftedge.microsoft.com/v1/products/${EDGE_ADDONS_PRODUCT_ID}"
          headers=(
            -H "Authorization: ApiKey ${EDGE_ADDONS_API_KEY}"
            -H "X-ClientID: ${EDGE_ADDONS_CLIENT_ID}"
          )

          echo "Uploading Chromium package for ${RELEASE_TAG} to Microsoft Edge Add-ons..."
          upload_headers="$(mktemp)"
          upload_status="$(curl --silent --show-error --output upload-response.json \
            --dump-header "$upload_headers" --write-out '%{http_code}' \
            "${headers[@]}" -H 'Content-Type: application/zip' \
            --request POST --data-binary @extension/dist/f1_dash_chrome.zip \
            "${api}/submissions/draft/package")"

          if [[ "$upload_status" != "202" ]]; then
            cat upload-response.json
            echo "Edge package upload failed with HTTP ${upload_status}."
            exit 1
          fi

          operation_id="$(awk 'BEGIN {IGNORECASE=1} /^Location:/ {gsub("\\r", ""); sub(".*/", "", $2); print $2}' "$upload_headers")"
          if [[ -z "$operation_id" ]]; then
            cat upload-response.json
            echo "Edge upload response did not include an operation ID."
            exit 1
          fi

          upload_ready=false
          for attempt in $(seq 1 30); do
            response="$(curl --silent --show-error "${headers[@]}" \
              "${api}/submissions/draft/package/operations/${operation_id}")"
            status="$(printf '%s' "$response" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("status", ""))')"
            if [[ "$status" == "Succeeded" ]]; then
              upload_ready=true
              break
            elif [[ "$status" == "Failed" ]]; then
              printf '%s\n' "$response"
              echo "Edge package validation failed."
              exit 1
            fi
            sleep 10
          done

          if [[ "$upload_ready" != true ]]; then
            echo "Timed out waiting for Edge package validation."
            exit 1
          fi

          echo "Submitting the validated package to Microsoft Edge Add-ons for certification..."
          publish_headers="$(mktemp)"
          publish_status="$(curl --silent --show-error --output publish-response.json \
            --dump-header "$publish_headers" --write-out '%{http_code}' \
            "${headers[@]}" -H 'Content-Type: text/plain' \
            --request POST --data "F1 Dash release ${RELEASE_TAG}. See the GitHub release notes for details." \
            "${api}/submissions")"

          if [[ "$publish_status" != "202" ]]; then
            cat publish-response.json
            echo "Edge submission failed with HTTP ${publish_status}."
            exit 1
          fi

          publish_operation_id="$(awk 'BEGIN {IGNORECASE=1} /^Location:/ {gsub("\\r", ""); sub(".*/", "", $2); print $2}' "$publish_headers")"
          if [[ -z "$publish_operation_id" ]]; then
            cat publish-response.json
            echo "Edge submission response did not include an operation ID."
            exit 1
          fi

          publish_ready=false
          for attempt in $(seq 1 30); do
            response="$(curl --silent --show-error "${headers[@]}" \
              "${api}/submissions/operations/${publish_operation_id}")"
            status="$(printf '%s' "$response" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("status", ""))')"
            if [[ "$status" == "Succeeded" ]]; then
              publish_ready=true
              break
            elif [[ "$status" == "Failed" ]]; then
              printf '%s\n' "$response"
              echo "Edge submission failed."
              exit 1
            fi
            sleep 10
          done

          if [[ "$publish_ready" != true ]]; then
            echo "Timed out waiting for Edge to accept the submission."
            exit 1
          fi

          echo "Edge submission accepted for certification."
